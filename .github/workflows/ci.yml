name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Format, lint, typecheck (app and convex/), knip, tests, icons, build.
      - name: CI preflight
        run: pnpm run ci:preflight

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # A secret can't be tested in a job-level `if` (it invalidates the whole
    # workflow), so each step checks its env copy instead. Without
    # E2E_VITE_CONVEX_URL the job passes without running anything. What the
    # secrets are is described in AGENTS.md ("Test and verify").
    env:
      VITE_CONVEX_URL: ${{ secrets.E2E_VITE_CONVEX_URL }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_VITE_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      CI: true
    steps:
      - name: Skip when the E2E secret is unset
        if: ${{ env.VITE_CONVEX_URL == '' }}
        run: echo "E2E_VITE_CONVEX_URL is not set; skipping e2e."

      - if: ${{ env.VITE_CONVEX_URL != '' }}
        uses: actions/checkout@v4

      - if: ${{ env.VITE_CONVEX_URL != '' }}
        uses: pnpm/action-setup@v4

      - if: ${{ env.VITE_CONVEX_URL != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: ${{ env.VITE_CONVEX_URL != '' }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: ${{ env.VITE_CONVEX_URL != '' }}
        run: pnpm run test:e2e:install

      - name: E2E tests
        if: ${{ env.VITE_CONVEX_URL != '' }}
        run: pnpm run test:e2e

      - name: Keep the Playwright report
        if: ${{ failure() && env.VITE_CONVEX_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
